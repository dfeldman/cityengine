<!doctype html>
<!--
  A benchmark answer, rendered: tools/benchmark/modeling/shoot.ts drives it through the dev server
  (http://localhost:5200/tools/benchmark/modeling/viewer.html). By hand: ?run=<path under the repo to a run record>
  shows that record; drag to orbit. The footprint is drawn in red on the ground, the front (−z) marked by a short
  red post at its middle.
-->
<html><head><meta charset="utf-8"><title>Benchmark viewer</title>
<style>html,body{margin:0;background:#b7c6d4;overflow:hidden}canvas{width:100vw;height:100vh;display:block}#msg{position:fixed;left:8px;top:6px;font:12px sans-serif;color:#123}</style></head>
<body><canvas id="c"></canvas><div id="msg"></div>
<script type="module">
import { Engine } from '@babylonjs/core/Engines/engine'
import { Scene } from '@babylonjs/core/scene'
import { ArcRotateCamera } from '@babylonjs/core/Cameras/arcRotateCamera'
import { HemisphericLight } from '@babylonjs/core/Lights/hemisphericLight'
import { DirectionalLight } from '@babylonjs/core/Lights/directionalLight'
import { Vector3 } from '@babylonjs/core/Maths/math.vector'
import { Color3, Color4 } from '@babylonjs/core/Maths/math.color'
import { Mesh } from '@babylonjs/core/Meshes/mesh'
import { VertexData } from '@babylonjs/core/Meshes/mesh.vertexData'
import { MeshBuilder } from '@babylonjs/core/Meshes/meshBuilder'
import { StandardMaterial } from '@babylonjs/core/Materials/standardMaterial'
import { compile } from './dsl.ts'

const canvas = document.getElementById('c')
const engine = new Engine(canvas, true, { preserveDrawingBuffer: true })
const scene = new Scene(engine)
scene.clearColor = new Color4(0.72, 0.78, 0.83, 1)
const hemi = new HemisphericLight('h', new Vector3(0, 1, 0), scene)
hemi.intensity = 0.75
hemi.groundColor = new Color3(0.35, 0.35, 0.38)
const sun = new DirectionalLight('s', new Vector3(-0.45, -0.8, 0.35), scene)
sun.intensity = 0.9
const cam = new ArcRotateCamera('cam', -Math.PI / 4, 1.1, 300, Vector3.Zero(), scene)
cam.attachControl(canvas, true)
cam.minZ = 0.5
cam.maxZ = 20000
let parts = []
let fit = { r: 100, h: 30 }

function clear() { for (const m of parts) m.dispose(); parts = [] }

/** model: the answer's JSON; outline: [[x, z]…]; height: the given height. Returns the checker's findings. */
window.__show = (model, outline, height) => {
  clear()
  const c = compile(model, { lenient: true })
  const ground = MeshBuilder.CreateGround('g', { width: 4000, height: 4000 }, scene)
  const gm = new StandardMaterial('gm', scene); gm.diffuseColor = new Color3(0.62, 0.64, 0.6); gm.specularColor = Color3.Black()
  ground.material = gm; ground.position.y = -0.05; parts.push(ground)
  if (outline?.length) {
    const pts = [...outline, outline[0]].map(([x, z]) => new Vector3(x, 0.15, z))
    const line = MeshBuilder.CreateLines('fp', { points: pts }, scene); line.color = new Color3(0.85, 0.1, 0.1); parts.push(line)
    const zs = outline.map((p) => p[1]), zmin = Math.min(...zs)
    const post = MeshBuilder.CreateLines('front', { points: [new Vector3(0, 0, zmin), new Vector3(0, Math.max(4, height * 0.08), zmin)] }, scene)
    post.color = new Color3(0.85, 0.1, 0.1); parts.push(post)
  }
  if (c.mesh.indices.length) {
    const m = new Mesh('model', scene)
    const vd = new VertexData()
    vd.positions = c.mesh.positions; vd.normals = c.mesh.normals
    // dsl.ts winds front faces counter-clockwise (the glTF way); Babylon's left-handed default takes clockwise as
    // the front, and two-sided lighting would otherwise light every face from behind
    const idx = c.mesh.indices.slice(); for (let i = 0; i < idx.length; i += 3) { const t = idx[i + 1]; idx[i + 1] = idx[i + 2]; idx[i + 2] = t }
    vd.indices = idx
    vd.colors = []; for (let i = 0; i < c.mesh.colors.length; i += 3) vd.colors.push(c.mesh.colors[i], c.mesh.colors[i + 1], c.mesh.colors[i + 2], 1)
    vd.applyToMesh(m)
    const mat = new StandardMaterial('mm', scene)
    mat.diffuseColor = Color3.White(); mat.specularColor = new Color3(0.05, 0.05, 0.05)
    mat.backFaceCulling = false; mat.twoSidedLighting = true
    m.material = mat; m.useVertexColors = true; m.hasVertexAlpha = false
    parts.push(m)
  }
  // frame on the footprint and the given height, not the model: a model far too big or too small should LOOK it
  const xs = (outline ?? [[-50, -50], [50, 50]]).map((p) => p[0]), zs = (outline ?? [[-50, -50], [50, 50]]).map((p) => p[1])
  const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...zs) - Math.min(...zs))
  fit = { r: Math.max(span, height * 1.4) * 1.55, h: height }
  document.getElementById('msg').textContent = c.bail ? `bail: ${c.bail}` : `${c.triangles} triangles, ${c.parts.length} parts${c.errors.length ? `, ${c.errors.length} errors` : ''}`
  return { ok: c.ok, errors: c.errors, triangles: c.triangles, parts: c.parts.length }
}

/** a mesh given outright (the game's own reference model, from reference.ts), on the same stage and framing */
window.__showMesh = (mesh, outline, height) => {
  window.__show({ parts: [] }, outline, height)
  const m = new Mesh('reference', scene)
  const vd = new VertexData()
  vd.positions = mesh.positions; vd.normals = mesh.normals
  // the game's MeshBuilder winds as Babylon expects (it draws straight into the game), unlike dsl.ts
  vd.indices = mesh.indices
  vd.colors = []; for (let i = 0; i < mesh.colors.length; i += 3) vd.colors.push(mesh.colors[i], mesh.colors[i + 1], mesh.colors[i + 2], 1)
  vd.applyToMesh(m)
  const mat = new StandardMaterial('rm', scene)
  mat.diffuseColor = Color3.White(); mat.specularColor = new Color3(0.05, 0.05, 0.05)
  mat.backFaceCulling = false; mat.twoSidedLighting = true
  m.material = mat; m.useVertexColors = true; m.hasVertexAlpha = false
  parts.push(m)
  document.getElementById('msg').textContent = `${mesh.indices.length / 3} triangles (game reference)`
  return { triangles: mesh.indices.length / 3 }
}

const VIEWS = {
  front34: [-Math.PI / 4, 1.2],
  front: [-Math.PI / 2, 1.35],
  rear34: [(3 * Math.PI) / 4, 1.2],
  top: [-Math.PI / 2, 0.02],
}
window.__shoot = async (view) => {
  const [a, b] = VIEWS[view]
  // the target first: setting it rebuilds alpha, beta and radius from the camera's current position
  cam.target = new Vector3(0, view === 'top' ? 0 : fit.h * 0.35, 0)
  cam.alpha = a; cam.beta = b; cam.radius = view === 'top' ? fit.r * 0.95 : fit.r
  await scene.whenReadyAsync()
  for (let i = 0; i < 3; i++) scene.render()
  return canvas.toDataURL('image/png')
}

engine.runRenderLoop(() => scene.render())
window.addEventListener('resize', () => engine.resize())
const run = new URLSearchParams(location.search).get('run')
if (run) {
  const rec = await (await fetch('/' + run)).json()
  const plan = rec.plan ?? null
  window.__show(rec.final.json ?? {}, plan?.outline, plan?.height ?? 40)
  cam.target = new Vector3(0, fit.h * 0.35, 0); cam.radius = fit.r
}
window.__ready = true
</script></body></html>
