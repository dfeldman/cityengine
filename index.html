<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Cycle Dash</title>
    <!-- the share card (Open Graph / Twitter): public/og.jpg, 1200×630, the chase camera over Lombard Street -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cycle Dash" />
    <meta property="og:title" content="Cycle Dash" />
    <meta property="og:url" content="https://dash.dfeldman.org/" />
    <meta property="og:image" content="https://dash.dfeldman.org/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cycle Dash: Lombard Street and San Francisco from above" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cycle Dash" />
    <meta name="twitter:image" content="https://dash.dfeldman.org/og.jpg" />
    <style>
      :root { color-scheme: dark }
      html, body { margin: 0; height: 100%; background: #14161a; overflow: hidden }
      /* a game, not a page: no text selection, no long-press callout, no double-tap zoom (pinch: main.ts) */
      html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none }
      input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text }
      #view { width: 100vw; height: 100vh; display: block; touch-action: none }
      #label {
        position: fixed; left: 16px; bottom: 14px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e8e6e1; text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none;
        max-width: 60vw;
      }
      .sr-city { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 5;
        font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: #f2efe9; background: rgba(18,20,24,.7);
        border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 5px 8px; }
      /* the landmark menu sits under the city menu, so neither covers the other at any width */
      .sr-landmarks { top: 52px; width: 240px; max-width: 70vw; }
      .sr-nocity { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: #e8e6e1; }
      .sr-nocity a { color: #ffd479 } .sr-nocity code { opacity: .6 }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="label">loading…</div>
    <div id="hud"></div>
    <canvas id="minimap"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
