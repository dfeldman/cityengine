<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Cycle Dash</title>
    <!-- the share card (Open Graph / Twitter): public/og.jpg, 1200×630, the chase camera over Lombard Street -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cycle Dash" />
    <meta property="og:title" content="Cycle Dash" />
    <meta property="og:url" content="https://dash.dfeldman.org/" />
    <meta property="og:image" content="https://dash.dfeldman.org/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cycle Dash: Lombard Street and San Francisco from above" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cycle Dash" />
    <meta name="twitter:image" content="https://dash.dfeldman.org/og.jpg" />
    <style>
      :root { color-scheme: dark }
      html, body { margin: 0; height: 100%; background: #14161a; overflow: hidden }
      /* a game, not a page: no text selection, no long-press callout, no double-tap zoom (pinch: main.ts) */
      html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none }
      input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text }
      #view { width: 100vw; height: 100vh; display: block; touch-action: none }
      /* the ODbL credit: required and visible, but a corner, not a line of its own (owner, 2026-10-14) */
      #label {
        position: fixed; right: 8px; bottom: 4px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e8e6e1; text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none;
        max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .sr-city { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 5;
        font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: #f2efe9; background: rgba(18,20,24,.7);
        border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 5px 8px; }
      /* the landmark menu sits under the city menu, so neither covers the other at any width */
      .sr-landmarks { top: 52px; width: 240px; max-width: 70vw; }
      .sr-nocity { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: #e8e6e1; }
      .sr-nocity a { color: #ffd479 } .sr-nocity code { opacity: .6 }
      /*
       * THE LOADING SCREEN, in the page itself so it is there the moment the page is (owner, 2026-10-14: "the
       * progress bar takes a moment to show up" — it used to wait for the game's script and the asset catalogue).
       * ui/loading.ts LoadingScreen adopts it; its LOADING_CSS repeats these rules with the theme's variables.
       */
      .sr-loading { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 30%, #1b2460 0%, #0b0f24 70%); transition: opacity .6s ease;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, 'Segoe UI', Roboto, Arial, sans-serif; color: #eef1ff }
      .sr-loading.gone { opacity: 0; pointer-events: none }
      .sr-loading .sr-card { width: min(520px, 86vw); padding: 30px 34px 28px; text-align: center; background: rgba(17,22,52,.84);
        border: 1px solid rgba(125,140,210,.32); border-radius: 18px; box-shadow: 0 14px 36px rgba(0,0,0,.35) }
      .sr-loading .sr-pill { display: inline-block; font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
        background: #22c7ee; color: #04212b; border-radius: 999px; padding: 5px 10px }
      .sr-loading h1 { margin: 10px 0 2px; font-size: 38px; font-weight: 800; line-height: 1.1 }
      .sr-loading .city { font-size: 18px; font-weight: 600; color: #a3acd6; margin-bottom: 22px; min-height: 1.4em }
      .sr-loading .bar { height: 12px; border-radius: 999px; background: rgba(29,36,78,.9); overflow: hidden }
      .sr-loading .fill { height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(90deg, #22c7ee, #3b82ff);
        transform-origin: left; transform: scaleX(0) }
      .sr-loading .what { margin-top: 12px; font-size: 15px; color: #a3acd6; min-height: 1.4em }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="label"></div>
    <div class="sr-loading" id="sr-boot"><div class="sr-card"><span class="sr-pill">Dandyhorse</span><h1>Cycle Dash</h1>
      <div class="city"></div><div class="bar"><div class="fill"></div></div><div class="what">Loading the game…</div></div></div>
    <script>
      // the bar moves from the first moment: toward the end of the first stage, eased, on the compositor (so it keeps
      // moving while the script loads); ui/loading.ts takes over with the real stages (its first: 'boot', 1.1 s of 16.6)
      requestAnimationFrame(() => { const f = document.querySelector('#sr-boot .fill'); f.style.transition = 'transform 1.8s cubic-bezier(.2,.7,.4,1)'; f.style.transform = 'scaleX(.08)' })
    </script>
    <div id="hud"></div>
    <canvas id="minimap"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
